[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmdchain"
version = "0.2.0"
description = "Fluent CLI tool chaining for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
keywords = ["cli", "subprocess", "pipe", "chain"]
authors = [
    { name = "Darcy Luis Neves Bras da Silva", email = "stardevelin@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
]

[project.scripts]
clichain = "clichain.cli:main"

[project.optional-dependencies]
compile = [
    "pyinstaller>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "coverage>=7.6",
    "ruff>=0.9",
    "basedpyright>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clichain", "src/cmdchain"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["clichain"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
pythonPlatform = "All"
include = ["src", "tests"]
extraPaths = ["src"]
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = ["error"]

[tool.coverage.run]
source = ["clichain"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
